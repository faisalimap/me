<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d9ff3f">
<title>404 | Kit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Cpath d='M20 20h24M20 32h24M20 44h24' stroke='%23d9ff3f' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--ink:#121212;--muted:#6d6d66;--line:#d8d5cd;--accent:#d9ff3f}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:40px;overflow:hidden}
::selection{background:var(--ink);color:var(--accent)}
a{text-decoration:none;color:inherit}
.wrap{width:min(900px,100%);text-align:center;position:relative}
.logo{position:fixed;top:28px;left:5vw;font:700 25px/1 "Space Grotesk";letter-spacing:-2px}
.logo span{color:var(--accent)}
.number{font:800 clamp(130px,24vw,280px)/.78 "Space Grotesk";letter-spacing:-15px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--muted);margin:22px 0}
h1{font:700 clamp(42px,7vw,76px)/.9 "Space Grotesk";letter-spacing:-4px}
h1 span{color:#888}
p{max-width:520px;margin:25px auto 30px;color:var(--muted);line-height:1.75;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:14px;padding:15px 20px;background:var(--ink);color:#fff;border:1px solid var(--ink);font-size:13px;font-weight:700;transition:.25s;box-shadow:5px 5px 0 var(--accent)}
.btn:hover{transform:translate(-2px,-2px)}
.line{width:min(430px,60vw);height:1px;background:var(--line);margin:55px auto 0}
.sub{margin-top:18px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#999}
@media(max-width:520px){body{padding:25px}.logo{left:6vw;top:25px}.number{letter-spacing:-8px}h1{letter-spacing:-2px}}
</style>
</head>
<body>
<a class="logo" href="index.html">FM<span>.</span> / kit</a>
<main class="wrap">
  <div class="number">404</div>
  <p class="eyebrow">Page not found</p>
  <h1>This route went<br><span>off the branch.</span></h1>
  <p>The page you requested does not exist here. The repository probably still exists, because unlike this URL, Git is annoyingly persistent.</p>
  <a class="btn" href="index.html">← Back to Kit</a>
  <div class="line"></div>
  <div class="sub">Same working tree. Wrong path.</div>
</main>
</body>
</html>
